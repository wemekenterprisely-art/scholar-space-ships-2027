name: ScholarSpace-ships Scan

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 06:00 Libya - Deep Global Search
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode (quick/standard/deep/comprehensive/adaptive)'
        required: false
        default: 'adaptive'
        type: choice
        options:
          - quick
          - standard
          - deep
          - comprehensive
          - adaptive
  push:
    branches: [main]

concurrency:
  group: scholar-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for comprehensive global search
    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
      TO_EMAIL:           ${{ secrets.TO_EMAIL }}
      GITHUB_TOKEN:       ${{ github.token }}
      OLLAMA_MODEL:       qwen2.5:1.5b
      SCHOLAR_MIN_SCORE:  "55"
      SCHOLAR_MAX_AI_JOBS: "15"
      SCAN_MODE:          ${{ github.event.inputs.mode || 'adaptive' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore persistent state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py download

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: scholar-qwen2.5-1.5b

      - name: Install Ollama
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Pull model
        run: ollama pull qwen2.5:1.5b || true

      - name: Verify gates (fast fail)
        run: |
          python test_filters.py
          python scholar_ollama_test.py

      - name: Auto-discover new scholarship sources
        run: python source_discovery.py
        continue-on-error: true

      - name: Run scholarship scan (adaptive mode)
        run: python scanner.py --mode ${{ env.SCAN_MODE }} --tier 3

      - name: Export metrics & health
        if: always()
        run: |
          echo "=== health.json ==="; cat output/health.json 2>/dev/null || echo "no health"
          echo "=== metrics.json ==="; cat output/metrics.json 2>/dev/null | head -n 80 || echo "no metrics"

      - name: Save persistent state
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python state_sync.py upload

      - name: Notify failure on Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "❌ ScholarSpace scan FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true

      - name: Upload report artifacts (Excel + JSON state)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarship-report
          path: |
            output/*.xlsx
            output/*.json
          if-no-files-found: ignore
